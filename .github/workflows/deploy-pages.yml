name: Deploy site

# Builds the web app with the newest data from the "data-latest" release, writes the
# auto-updating rank-band playlists, and deploys to GitHub Pages.
# Requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["web/**", "pipeline/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v6
      - run: pip install ./pipeline
      - name: Download latest data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads web/public/data
          if gh release download data-latest --pattern 'site-data-*.tar.gz' --dir downloads; then
            for archive in downloads/site-data-*.tar.gz; do tar -xzf "$archive" -C web/public/data; done
          fi
          if ! ls web/public/data/*/meta.json >/dev/null 2>&1; then
            echo "::warning::No published data yet; deploying with synthetic sample data. Run the 'Refresh data' workflow."
            python -m ppanalyzer sample --out raw-sample
            python -m ppanalyzer build --raw raw-sample --out web/public/data/sample --shards 32
          fi
          python -m ppanalyzer sources --site web/public/data
          cat web/public/data/sources.json
      - run: npm ci
        working-directory: web
      - name: Write auto-updating rank-band playlists
        working-directory: web
        run: npm run playlists -- --data public/data --site-url "${{ steps.pages.outputs.base_url }}"
      - run: npm run build
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
