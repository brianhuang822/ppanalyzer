[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppanalyzer"
version = "2.0.0"
description = "Collect ScoreSaber / BeatLeader top plays and build the PP Analyzer site data"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6"]

[project.scripts]
ppanalyzer = "ppanalyzer.cli:main"

[tool.setuptools.packages.find]
include = ["ppanalyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
